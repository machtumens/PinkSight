
schema: pinksight.novel-heads/arm6-v1
arm: 6
wave: 1
role: drug-sensitivity-resemblance-characterisation
compute: cpu-zero-dollar
model: lightgbm
populated: false

datasets:
  prism_drug_info: TBD/secondary_screen_drug_info.csv
  ccle_expression: TBD/CCLE_expression.csv
  tumor_expression: TBD/metabric_or_tcga_expression.csv
drug_classes: [aromatase_inhibitor, taxane]

target: sensitivity_resemblance

seeds: [0, 1, 2]
kill_threshold_auroc: 0.52
greenlight_threshold_auroc: 0.60
greenlight_concordance_p: 0.05

zero_shared_patient: trivially_true

ledger_guard: >
  resemblance-to-sensitive-cell-line-phenotype at diagnosis.
  Never "predicts who responds" / treatment-response predictor (FORBIDDEN by LOCK-1).
