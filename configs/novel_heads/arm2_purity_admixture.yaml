
schema: pinksight.novel-heads/arm2-v1
arm: 2
wave: 1
role: subtype-admixture-characterisation
compute: cpu-zero-dollar
model: lightgbm
populated: false

datasets:
  metabric_expression: TBD/metabric_gene_expression.csv
  metabric_clinical: TBD/metabric_clinical.tsv
