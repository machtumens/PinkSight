
schema: pinksight.novel-heads/arm8-v1
arm: 8
wave: 1
role: proteogenomic-discordance-characterisation
compute: cpu-zero-dollar
model: correlation_then_lightgbm
populated: true
pilot_power: true

datasets:
  cptac_brca_proteomics: "cptac.Brca().get_proteomics('umich')"
  cptac_brca_mrna: "cptac.Brca().get_transcriptomics('washu')"
  cache_dir: data/genomics/cptac_brca/

target: discordance_burden

seeds: [0, 1, 2]
bootstrap_n: 1000
kill_threshold_pearson_r_abs: 0.10
greenlight_threshold_pearson_r_abs: 0.25
greenlight_bootstrap_ci_lb: 0.05

ledger_guard: >
  post-transcriptional regulation burden characterisation at diagnosis (pilot, N=122).
  Never a generalisation claim from N=122.
