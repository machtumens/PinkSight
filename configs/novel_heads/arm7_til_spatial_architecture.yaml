
schema: pinksight.novel-heads/arm7-v1
arm: 7
wave: 3
role: til-spatial-architecture-characterisation
compute: cpu-floor-then-gpu-segment
model: lightgbm_on_graph_metrics
populated: true
gated_behind: wave1_or_wave2_greenlight
adr_required: docs/adr/0013-arm7-tiger-til-spatial-architecture.md
report_keyword_guard_arm_id: arm7

datasets:
  tiger_wsi: TBD/TIGER
  til_annotations: TBD/tiger_til_maps

trackb_entrypoint_config: configs/novel_heads/trackb_entrypoint.yaml

target: til_spatial_topology

check_no_survival_labels: true
forbidden_survival_patterns:
  [survival, os_, dfs_, pfs_, rfs_, event, censored, deceased, died, death, months_to, days_to, outcome]

seeds: [0, 1, 2]
kill_threshold_stil_auroc: 0.55
greenlight_threshold_stil_auroc: 0.65
greenlight_spatial_gain: 0.10

ledger_guard: >
  TIL spatial-architecture characterisation at diagnosis (TIGER). No survival prediction.
  No cross-institution generalisation. Spatial topology adds to scalar TIL — not replacing it.
