
schema: pinksight.novel-heads/arm5-v1
arm: 5
wave: 3
role: proliferation-index-characterisation
compute: cpu-floor-then-gpu-embed
model: ridge_on_embeddings
populated: true
gated_behind: wave1_or_wave2_greenlight
adr_required: docs/adr/0014-arm5-tupac16-proliferation-index.md

forbidden_task: tupac16_mitotic_count
forbidden_task_aliases: [mitosis_detection, mitotic_score, mitotic_count_per_hpf]

datasets:
  tupac16_wsi: TBD/TUPAC16
  pam50_proliferation_scores: TBD/tupac16_pam50_proliferation.tsv

trackb_entrypoint_config: configs/novel_heads/trackb_entrypoint.yaml

target: pam50_proliferation_score

seeds: [0, 1, 2]
kill_threshold_pearson_r_abs: 0.20
greenlight_threshold_pearson_r_abs: 0.35

report_keyword_guard_arm_id: arm5

ledger_guard: >
  PAM50 proliferation-index characterisation from WSI at diagnosis (TUPAC16).
  NOT a mitotic-rate or growth-kinetics prediction. Ki-67 surrogate framing only.
