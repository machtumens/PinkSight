[project]
name = "pinksight"
version = "0.0.0"
description = "Multimodal DCE-MRI + clinical fusion for breast-cancer subtype + Ki-67 (Team TestEin, OPSI 2026)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "monai>=1.3",
    "nnunetv2>=2.5",
    "shap>=0.45",
    "captum>=0.7",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "rtdl-revisiting-models>=0.0.2",
    "SimpleITK>=2.3",
    "intensity-normalization>=2.2",
    "pyradiomics @ git+https://github.com/AIM-Harvard/pyradiomics.git",
]
arms = [
    "lightgbm>=4.0",
    "scikit-learn>=1.5",
]
trackb = [
    "h5py>=3.10",
    "openslide-python>=1.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]
"ci/**" = ["T20"]
"tests/**" = ["T20"]

[tool.pytest.ini_options]
markers = [
    "leakage: patient-split / leakage-sentinel integrity checks (LOCK-2)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pinksight"]
