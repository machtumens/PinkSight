name: ci
# Makes integrity executable: the claim-ledger guard, the LOCK-2 leakage/split firewall, and the
# zero-data synthetic control-sentinel demo all run on every push and pull request. Scoped to what
# THIS release repo actually ships — no consistency-lint / map-lint jobs (their target docs,
# decisions.md and docs/map/MASTER.md, are deliberately not part of the public package).
on:
  push:
  pull_request:

jobs:
  ledger-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python ci/ledger_lint.py --selfcheck
      - run: uv run python ci/ledger_lint.py .

  leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      # No `-m leakage` filter — deliberate (phase-5 plan INNOVATE Decision 1): 6 of the 8 LOCK-2
      # assertions carry no pytest marker and would be SILENTLY skipped by a marker-filtered run,
      # which is exactly the under-selection failure mode this unfiltered run removes. Running the
      # files whole is also self-maintaining: any future test added to them is checked automatically.
      #
      # LOCAL-ONLY ATTESTATION BOUNDARY (read before "why are some tests SKIPPED?"):
      # A subset of the LOCK-2 assertions need DUA-bound real-data files that this repo never ships
      # (they are .gitignore'd: data/raw/Clinical_and_Other_Features.xlsx and
      # data/mamma_mia/clinical_and_imaging_info.xlsx). Those tests carry pytest.skip() guards and
      # will show as SKIPPED here BY DESIGN — namely test_grade_label_counts and
      # test_mama_mia_duke_overlap_excluded_real. Torch-gated tests (importorskip) also SKIP on this
      # torch-free runner. Phase 4 already ran the full 8/8 LOCK-2 set on real data locally, once,
      # EVL-confirmed — that is a LOCAL one-time attestation, NOT CI-runnable, because CI runners
      # never see DUA-bound patient data, on purpose. CI never claims to prove what it cannot see;
      # the visible SKIPPED lines are the honest boundary, not a gap being hidden.
      #
      # `--with scipy` (ephemeral, seconds) makes the scipy-only h0_localizer test reachable without
      # paying for the multi-GB `ml` extra (torch/monai/pyradiomics-from-git). scipy is also declared
      # in the `ml` extra now (real dep bug fixed) so local `[ml]` installs get it too.
      - run: >-
          uv run --with scipy pytest -q
          tests/test_leakage.py
          tests/test_splits.py
          tests/test_h0_localizer.py::test_predicted_roi_box_feeds_preprocess_crop
          -v

  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately plain pip/venv, not uv — mirrors the README's documented consumer path exactly
      # (Quickstart: `pip install -e .` + `make demo`), so a green run here is direct evidence the
      # DOCUMENTED instructions work, not just an internal uv shortcut (phase-5 plan Step C5).
      - run: python3 -m pip install -e .
      - run: make demo
