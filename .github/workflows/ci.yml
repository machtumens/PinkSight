name: ci
on:
  push:
  pull_request:

jobs:
  ledger-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python ci/ledger_lint.py --selfcheck
      - run: uv run python ci/ledger_lint.py .

  leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: >-
          uv run --with scipy pytest -q
          tests/test_leakage.py
          tests/test_splits.py
          tests/test_h0_localizer.py::test_predicted_roi_box_feeds_preprocess_crop
          -v

  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -e .
      - run: make demo
